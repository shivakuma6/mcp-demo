name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  playwright-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npm run test:ci
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Upload test-results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  ai-style-pr-analysis:
    name: AI-Style PR Analysis
    needs: playwright-tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze PR changes
        run: |
          echo "Changed files:"
          git fetch origin main
          git diff --name-only origin/main > changed_files.txt
          cat changed_files.txt
          echo "\nImpacted Areas:"
          awk -F/ '{print $1}' changed_files.txt | sort | uniq
          echo "\nTest Suggestions:"
          awk '/\.js$|\.ts$|\.jsx$|\.tsx$|\.py$|\.java$|\.go$|\.rb$|\.php$|\.html$|\.css$|\.json$/ {print "Consider adding or updating tests for: " $0}' changed_files.txt

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: playwright-tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v4
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
